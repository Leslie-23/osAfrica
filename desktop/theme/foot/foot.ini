# osAfrica theme for foot terminal
# Copy to ~/.config/foot/foot.ini

[main]
font=Noto Sans Mono:size=11
pad=8x8
dpi-aware=yes

[cursor]
color=0a0a0a 00cc66
blink=yes

[colors]
foreground=e0e0e0
background=0a0a0a
selection-foreground=ffffff
selection-background=00cc66

regular0=0a0a0a
regular1=cc3333
regular2=00cc66
regular3=cccc00
regular4=6688cc
regular5=cc66cc
regular6=00cccc
regular7=cccccc

bright0=666666
bright1=ff4444
bright2=00ff88
bright3=ffff44
bright4=88aaff
bright5=ff88ff
bright6=44ffff
bright7=ffffff
