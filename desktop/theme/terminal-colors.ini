# osAfrica Terminal Color Scheme
# For VTE-based terminals (osa-terminal, foot, etc.)

[colors]
foreground = #e0e0e0
background = #0a0a0a
cursor = #00cc66
selection_foreground = #ffffff
selection_background = #00cc66

# Normal colors (0-7)
color0 = #0a0a0a
color1 = #cc3333
color2 = #00cc66
color3 = #cccc00
color4 = #6688cc
color5 = #cc66cc
color6 = #00cccc
color7 = #cccccc

# Bright colors (8-15)
color8 = #666666
color9 = #ff4444
color10 = #00ff88
color11 = #ffff44
color12 = #88aaff
color13 = #ff88ff
color14 = #44ffff
color15 = #ffffff
