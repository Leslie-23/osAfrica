<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00cc66" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00cc66" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <ellipse cx="960" cy="540" rx="800" ry="500" fill="url(#glow)"/>

  <!-- Subtle grid pattern -->
  <g stroke="#00cc66" stroke-opacity="0.03" stroke-width="0.5">
    <line x1="0" y1="0" x2="1920" y2="1080"/>
    <line x1="1920" y1="0" x2="0" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="480" y1="0" x2="480" y2="1080"/>
    <line x1="1440" y1="0" x2="1440" y2="1080"/>
    <line x1="0" y1="270" x2="1920" y2="270"/>
    <line x1="0" y1="810" x2="1920" y2="810"/>
  </g>

  <!-- Neural network nodes -->
  <g fill="none" stroke="#00cc66" stroke-opacity="0.06" stroke-width="0.5">
    <circle cx="960" cy="540" r="200"/>
    <circle cx="960" cy="540" r="300"/>
    <circle cx="960" cy="540" r="420"/>
  </g>

  <!-- Accent dots -->
  <g fill="#00cc66" fill-opacity="0.15">
    <circle cx="760" cy="440" r="3"/>
    <circle cx="1160" cy="640" r="3"/>
    <circle cx="860" cy="340" r="2"/>
    <circle cx="1060" cy="740" r="2"/>
    <circle cx="660" cy="540" r="2.5"/>
    <circle cx="1260" cy="540" r="2.5"/>
    <circle cx="960" cy="340" r="2"/>
    <circle cx="960" cy="740" r="2"/>
  </g>

  <!-- Connecting lines -->
  <g stroke="#00cc66" stroke-opacity="0.04" stroke-width="0.5">
    <line x1="760" y1="440" x2="960" y2="540"/>
    <line x1="1160" y1="640" x2="960" y2="540"/>
    <line x1="860" y1="340" x2="760" y2="440"/>
    <line x1="1060" y1="740" x2="1160" y2="640"/>
    <line x1="660" y1="540" x2="760" y2="440"/>
    <line x1="1260" y1="540" x2="1160" y2="640"/>
  </g>

  <!-- osAfrica text -->
  <text x="960" y="530" text-anchor="middle" font-family="sans-serif"
        font-size="48" font-weight="bold" fill="#00cc66" fill-opacity="0.12"
        letter-spacing="12">osAfrica</text>
  <text x="960" y="570" text-anchor="middle" font-family="sans-serif"
        font-size="14" fill="#00cc66" fill-opacity="0.08"
        letter-spacing="6">AI-NATIVE LINUX</text>
</svg>
