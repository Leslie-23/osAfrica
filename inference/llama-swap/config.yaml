# llama-swap configuration for osAfrica
# Manages model hot-swapping between Llama 3 8B and Qwen Coder
# Docs: https://github.com/mostlygeek/llama-swap

listen: "127.0.0.1:8080"
log_level: "info"

healthcheck:
  endpoint: "/health"

models:
  llama3-8b:
    cmd: >-
      llama-server
      --model /opt/osa/models/llama-3-8b-instruct-q4_k_m.gguf
      --host 127.0.0.1
      --port 8081
      --ctx-size ${OSA_CTX_SIZE:-2048}
      --threads ${OSA_THREADS:-4}
      --batch-size 512
      --flash-attn
      --cont-batching
      --chat-template llama3
      --cache-type-k q4_0
      --cache-type-v q4_0
    proxy: "http://127.0.0.1:8081"
    ttl: 0
    aliases:
      - "llama3"
      - "general"

  qwen-coder:
    cmd: >-
      llama-server
      --model /opt/osa/models/qwen2.5-coder-14b-instruct-q4_k_m.gguf
      --host 127.0.0.1
      --port 8082
      --ctx-size ${OSA_CTX_SIZE:-2048}
      --threads ${OSA_THREADS:-4}
      --batch-size 512
      --flash-attn
      --cont-batching
      --cache-type-k q4_0
      --cache-type-v q4_0
    proxy: "http://127.0.0.1:8082"
    ttl: 300
    aliases:
      - "qwen"
      - "code"

# Performance notes:
# --cache-type-k/v q4_0: quantized KV cache, ~4x less memory per context token
# --cont-batching: continuous batching for parallel requests
# --flash-attn: fused attention kernels, faster inference
# --batch-size 512: prompt processing batch size
# On 16GB: swap mode (one model at a time). On 32GB+: concurrent.
