# Custom command policy — extends the built-in rules.
# Commands here override the defaults in /etc/osa/command-policy.yaml

# Commands that always require confirmation (even in expert mode)
confirm:
  - "rm -rf /"
  - "mkfs"
  - "dd if="

# Commands that are always allowed without prompting
allow:
  - "ls"
  - "pwd"
  - "whoami"
  - "date"
  - "cat"
  - "head"
  - "tail"
  - "wc"

# Commands that are always blocked
block: []
