[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "osa-core"
version = "0.1.0"
description = "osAfrica AI core — router, shell, and system agents"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
authors = [{ name = "osAfrica Contributors" }]

dependencies = [
    "httpx>=0.27",
    "prompt_toolkit>=3.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
]

[project.scripts]
osa-shell = "osa_core.shell.osa_shell:main"
osa-routerd = "osa_core.router.router_daemon:main"

[tool.setuptools.packages.find]
include = ["osa_core*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
