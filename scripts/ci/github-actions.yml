# .github/workflows/ci.yml — Copy this to .github/workflows/ci.yml

name: osAfrica CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-ai-core:
    name: AI Core Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd ai-core
          pip install -e ".[dev]"

      - name: Lint
        run: |
          cd ai-core
          python -m ruff check osa_core/ tests/

      - name: Test
        run: |
          cd ai-core
          python -m pytest tests/ -v --tb=short

  build-hwdetect:
    name: Build Hardware Detector
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Build osa-hwdetect
        run: |
          cd system/osa-hwdetect
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build

  build-sandbox:
    name: Build Sandbox
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Build osa-sandbox
        run: |
          cd system/osa-sandbox
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
